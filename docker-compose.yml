version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edupath-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edupath_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edupath_secure_change_me_2026}
      POSTGRES_DB: ${POSTGRES_DB:-edupath}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
